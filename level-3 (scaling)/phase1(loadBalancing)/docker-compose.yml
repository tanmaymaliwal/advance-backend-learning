services:
  nginx:
    image: nginx
    ports:
      - 3000:80
    volumes:
      - ./nginx/nginx.conf:/etc/nginx/nginx.conf
   
  server1:
    build: ./server
    env_file:
      - ./server/.env
    environment:
      - SERVER_NAME="server1"
    ports:
      - 3001:8000

  server2:
    build: ./server
    env_file:
      - ./server/.env
    environment:
      - SERVER_NAME="server2"
    ports:
      - 3002:8000

  server3:
    build: ./server
    env_file:
      - ./server/.env
    environment:
      - SERVER_NAME="server3"
    ports:
      - 3003:8000

  
  